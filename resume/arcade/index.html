<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kyle's Journey to Software Engineer</title>
  <meta name="description" content="An interactive 8-bit arcade journey through Kyle's career — from breaking hard drives to AI engineering.">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Tall invisible scroll area -->
  <div id="scroll-area"></div>

  <!-- Fixed viewport -->
  <div id="viewport">

    <!-- Sky background for intro drop -->
    <div id="sky-bg"></div>

    <!-- The horizontally scrolling world -->
    <div id="world-strip">
      <div class="connector"><img src="assets/Connections.png" alt="Bridge"></div>
      <div class="stage" id="stage-1"><img src="assets/N_B1.png" alt="Stage 1 – Middle School"></div>
      <div class="connector"><img src="assets/Connections.png" alt="Bridge"></div>
      <div class="stage" id="stage-2"><img src="assets/N_B2.png" alt="Stage 2 – College Year 1"></div>
      <div class="connector"><img src="assets/Connections.png" alt="Bridge"></div>
      <div class="stage" id="stage-3"><img src="assets/N_B3.png" alt="Stage 3 – College Year 3"></div>
      <div class="connector"><img src="assets/Connections.png" alt="Bridge"></div>
      <div class="stage" id="stage-4"><img src="assets/N_B4.png" alt="Stage 4 – First Job"></div>
      <div class="connector"><img src="assets/Connections.png" alt="Bridge"></div>
      <div class="stage" id="stage-5"><img src="assets/N_B5.png" alt="Stage 5 – Naver"></div>
      <div class="connector"><img src="assets/Connections.png" alt="Bridge"></div>
      <div class="stage" id="stage-6"><img src="assets/N_B6.png" alt="Stage 6 – Amazon Canada"></div>
      <div class="connector"><img src="assets/Connections.png" alt="Bridge"></div>
      <div class="stage" id="stage-7"><img src="assets/N_B7.png" alt="Stage 7 – AI Engineering"></div>
    </div>

    <!-- Character -->
    <div id="character">
      <img id="char-sprite" src="assets/character_standing.png" alt="Kyle">
    </div>

    <!-- Dialog Box -->
    <div id="dialog-container">
      <img id="dialog-bg" src="assets/dialog_box.png" alt="Dialog Box">
      <div id="dialog-text"></div>
    </div>

    <!-- Intro Scene -->
    <div id="intro-scene" class="screen-overlay">
      <h1>Kyle's Journey to<br>Software Engineer</h1>
      <p class="blink">▼ Scroll Down to Start ▼</p>
    </div>

    <!-- Outro Scene -->
    <div id="outro-scene" class="screen-overlay hidden">
      <h1>Quest Complete!</h1>
      <p>Thanks for playing.</p>
      <div class="outro-links">
        <a href="https://www.linkedin.com/in/YOUR_LINKEDIN" target="_blank" rel="noopener">
          <span class="link-icon">in</span> LinkedIn
        </a>
        <a href="https://github.com/penpen787" target="_blank" rel="noopener">
          <span class="link-icon">◆</span> GitHub
        </a>
        <a href="/resume/kyle_resume.pdf" target="_blank" rel="noopener">
          <span class="link-icon">▤</span> Resume
        </a>
      </div>
    </div>

  </div>

  <script src="game.js"></script>
</body>
</html>
